<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tüm Kitaplar — Ortaokulluyuz</title>
<meta name="description" content="5-8. sınıf tüm ders kitapları: MEB resmî PDF'leri, konu özetleri ve indirme." />
<link rel="icon" type="image/svg+xml" href="img/logo.svg?v=13" />
<link rel="stylesheet" href="css/styles.css?v=11" />
<link rel="stylesheet" href="css/theme-v7.css?v=8" />
<link rel="stylesheet" href="css/theme-v8.css?v=3" />
</head>
<body data-sayfa="kitaplar">
<div id="iskelet-ust"></div>

<main class="sutun-dar px-4 py-5 space-y-6">
  <div class="kirinti"><a href="index.html">Anasayfa</a> / Tüm Kitaplar</div>
  <section>
    <div class="bolum-baslik"><span>Tüm Kitaplar</span><span id="kitapSayi" class="etiket"></span></div>
    <p class="bolum-aciklama">“MEB Resmî PDF” rozetli kitaplar Bakanlığın yayımladığı orijinal kitaplardır. “Yakında” rozetli kitaplar MEB portalında henüz yayımlanmamıştır.</p>
    <div class="kart p-3 grid md:grid-cols-4 gap-2">
      <select id="fSinif" class="girdi" onchange="filtre.sinif=this.value; if (this.value) Tercih.sinifGor(this.value); kitapListesiniCiz()"></select>
      <select id="fDers" class="girdi" onchange="filtre.ders=this.value; if (this.value) Tercih.dersGor(document.body.dataset.sinif || filtre.sinif, this.value); kitapListesiniCiz()"></select>
      <select id="fKaynak" class="girdi" onchange="filtre.kaynak=this.value;kitapListesiniCiz()">
        <option value="">Durum (tümü)</option>
        <option value="meb">MEB Resmî PDF'liler</option>
        <option value="katalog">MEB Sayfasında</option>
        <option value="yakinda">Yakında eklenecekler</option>
      </select>
      <input id="fQ" class="girdi" placeholder="Kitap, ünite veya konu arayın…" oninput="filtre.q=this.value;kitapListesiniCiz()" />
    </div>
    <div id="unitePanel" class="hidden mb-3 mt-3"></div>
    <div class="reklam-alani" data-reklam="banner"></div>
    <div id="kitaplar" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4 mt-3"></div>
  </section>
</main>

<div id="iskelet-alt"></div>
<div id="iskelet-modal"></div>














<script src="js/app.bundle.js?v=14"></script>
</body>
</html>
